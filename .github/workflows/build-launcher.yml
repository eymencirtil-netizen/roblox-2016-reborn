name: Build Windows Launcher
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Package Windows installer
        run: npm run launcher:pack
        env:
          REBORN_URL: ${{ vars.REBORN_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-reborn-windows
          path: dist-launcher/*.exe