services:
  - type: web
    name: roblox-2021-reborn
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: reborn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/reborn.sqlite
      - key: SESSION_DB_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
